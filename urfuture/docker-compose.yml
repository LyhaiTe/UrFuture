version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: cambodia-advisor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor
      POSTGRES_DB: urfuture
    ports:
      - '5433:5432'
    volumes:
      - advisor_pgdata:/var/lib/postgresql/data

volumes:
  advisor_pgdata:
