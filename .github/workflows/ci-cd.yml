name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev-v2
  pull_request:
    branches:
      - main
      - dev-v2
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Manual deploy target override'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - preview
          - production
          - skip-deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: 'urfuture'

jobs:
  # =========================================================================
  # JOB 1: CONTINUOUS INTEGRATION (Lint, Typecheck, Test, & Build)
  # =========================================================================
  ci:
    name: 🧪 Continuous Integration (Test & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
          POSTGRES_DB: urfuture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: urfuture

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'urfuture/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma client
        run: npx prisma generate

      - name: 🔍 Run ESLint checks
        run: npm run lint

      - name: 🏷️ Run TypeScript type checks
        run: npm run type-check

      - name: 🗃️ Synchronize database schema (pgvector)
        env:
          DATABASE_URL: "postgresql://advisor:advisor@localhost:5432/urfuture?schema=public"
        run: npx prisma db push --skip-generate

      - name: 🛡️ Run guardrails verification suite
        env:
          DATABASE_URL: "postgresql://advisor:advisor@localhost:5432/urfuture?schema=public"
          AUTH_SESSION_SECRET: "mock-session-secret-for-ci-testing-minimum-32-chars"
        run: npm run verify:guardrails

      - name: ⚡ Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: urfuture/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('urfuture/package-lock.json') }}-${{ hashFiles('urfuture/src/**/*', 'urfuture/public/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('urfuture/package-lock.json') }}-

      - name: 🏗️ Build Next.js application
        env:
          DATABASE_URL: "postgresql://advisor:advisor@localhost:5432/urfuture?schema=public"
          AUTH_SESSION_SECRET: "mock-session-secret-for-ci-testing-minimum-32-chars"
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # =========================================================================
  # JOB 2: VERCEL PREVIEW DEPLOYMENT (Pull Requests)
  # =========================================================================
  deploy-preview:
    name: 🚀 Deploy Preview to Vercel
    needs: [ci]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'preview')

    defaults:
      run:
        working-directory: urfuture

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔐 Check Vercel Credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) are not configured in GitHub Secrets. Skipping automated preview deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Install Vercel CLI
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel Environment Information (Preview)
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build Artifacts with Vercel
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy to Vercel Preview
        id: deploy
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 💬 Comment Preview URL on Pull Request
        if: steps.check-secrets.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            if (!issue_number) return;
            const deployUrl = '${{ steps.deploy.outputs.url }}';
            const commentTag = '<!-- vercel-preview-deployment -->';
            const body = `${commentTag}\n` +
              `### 🚀 Vercel Preview Deployment Ready!\n\n` +
              `| Status | Preview URL | Commit | Branch |\n` +
              `| :--- | :--- | :--- | :--- |\n` +
              `| ✅ **Deployed** | [${deployUrl}](${deployUrl}) | \`${context.sha.substring(0, 7)}\` | \`${context.ref.replace('refs/heads/', '')}\` |\n\n` +
              `> _Built and verified automatically by UrFuture CI/CD pipeline._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            const existing = comments.find(c => c.body && c.body.includes(commentTag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: body,
              });
            }

  # =========================================================================
  # JOB 3: VERCEL PRODUCTION DEPLOYMENT (Main branch push or explicit manual)
  # =========================================================================
  deploy-production:
    name: 🌐 Deploy Production to Vercel
    needs: [ci]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'production' || (inputs.deploy_target == 'auto' && github.ref == 'refs/heads/main')))

    defaults:
      run:
        working-directory: urfuture

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔐 Check Vercel Credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) are not configured in GitHub Secrets. Skipping automated production deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Install Vercel CLI
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel Environment Information (Production)
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build Artifacts with Vercel (Production)
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🌐 Deploy to Vercel Production
        id: deploy
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 📢 GitHub Actions Summary
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "### 🎉 Production Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Production URL: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
